services:
  app:
    image: ghcr.io/victorygrey/backend-eiger:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "192.168.18.31:8000:80"
    env_file:
      - /mnt/Tank/eiger-backend/config/runtime.env
    environment:
      EIGER_MEDIA_PATH: /var/www/html/storage/app/eiger-media
      PIM_LEGACY_MEDIA_PATH: /var/www/html/storage/app/pim-media
    volumes:
      - type: bind
        source: /mnt/Tank/eiger-backend/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Tank/eiger-backend/storage
        target: /var/www/html/storage
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Tank/nas-shared/eiger-media
        target: /var/www/html/storage/app/eiger-media
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_INCLUDE_RESTARTING=true
