; Match the LED Ambience form: one 500 MB video plus one 100 MB audio,
; with room for multipart headers and the remaining form fields.
upload_max_filesize = 500M
post_max_size = 610M
max_input_time = 300
max_execution_time = 300

; Bound private photo thumbnails to 16 MP; leave room for their GD decoder.
memory_limit = 256M

; Startup warnings must not corrupt JSON/error responses or disclose paths.
display_errors = Off
log_errors = On
